name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maaser-chomesh-upload/package-lock.json

      - name: Install dependencies
        working-directory: maaser-chomesh-upload
        run: npm ci

      - name: Build portable EXE
        working-directory: maaser-chomesh-upload
        run: npm run build:exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: maaser-chomesh-exe
          path: maaser-chomesh-upload/dist/*.exe
          if-no-files-found: error

      - name: Create release tag
        id: tag
        shell: bash
        run: echo "tag_name=exe-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: EXE Build ${{ github.run_number }}
          files: maaser-chomesh-upload/dist/*.exe
          generate_release_notes: true
